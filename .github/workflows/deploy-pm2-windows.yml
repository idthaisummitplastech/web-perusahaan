name: Deploy web-perusahaan to D PM2 — ZERO DOWNTIME

# Web TETAP ON selama git fetch + npm ci + next build.
# Downtime hanya ~1-2 detik saat swap .next + pm2 reload di akhir.
# .env di D:\itsp-perusahaan AMAN (di-ignore git).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-itsp-perusahaan
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + isolated build (ON) + atomic reload :3008
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Zero-downtime deploy D:\itsp-perusahaan
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path D:\itsp-perusahaan\.git)) { throw "D:\itsp-perusahaan belum git clone. Clone dulu: git clone https://github.com/idthaisummitplastech/web-perusahaan.git D:\itsp-perusahaan" }
          Set-Location D:\itsp-perusahaan
          try { Remove-Item -Path "$env:USERPROFILE\.gitconfig.lock" -Force -ErrorAction SilentlyContinue } catch {}
          try { git config --global --add safe.directory '*' 2>$null } catch {}
          Write-Host "--- VERSIONS ---"
          node -v; npm.cmd -v; whoami
          Write-Host "USERPROFILE=$env:USERPROFILE APPDATA=$env:APPDATA"
          $extraPaths = @(
            (Join-Path $env:APPDATA "npm"),
            "C:\Users\IT-PLASTECH\AppData\Roaming\npm",
            "C:\Users\Administrator\AppData\Roaming\npm",
            "C:\Program Files\nodejs"
          )
          foreach ($p in $extraPaths) { if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) { $env:Path = "$env:Path;$p" } }
          if (-not $env:PM2_HOME) { if (Test-Path "C:\Users\IT-PLASTECH\.pm2") { $env:PM2_HOME = "C:\Users\IT-PLASTECH\.pm2" } }
          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $pm2Cmd) { foreach ($p in $extraPaths) { $cand = Join-Path $p "pm2.cmd"; if (Test-Path $cand) { $pm2Cmd = $cand; break } } }
          if (-not $pm2Cmd) { npm.cmd i -g pm2; $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source; if (-not $pm2Cmd) { $maybe = Join-Path (Join-Path $env:APPDATA "npm") "pm2.cmd"; if (Test-Path $maybe) { $pm2Cmd = $maybe } } }
          if (-not $pm2Cmd) { throw "pm2.cmd tetap tidak ditemukan" }
          Write-Host "pm2 at: $pm2Cmd"; & $pm2Cmd -v
          $liveDir = "D:\itsp-perusahaan"
          $buildDir = "D:\itsp-perusahaan-build-tmp"
          $remoteUrl = (git config --get remote.origin.url); if (-not $remoteUrl) { $remoteUrl = "https://github.com/idthaisummitplastech/web-perusahaan.git" }
          Write-Host "--- GIT FETCH (web TETAP ON) ---"
          try { Remove-Item -Path .git\FETCH_HEAD -Force -ErrorAction SilentlyContinue } catch {}
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { try { Remove-Item -Path .git\FETCH_HEAD -Force -ErrorAction SilentlyContinue } catch {}; Start-Sleep -Seconds 2; git fetch origin main }
          if ($LASTEXITCODE -ne 0) { throw "git fetch gagal" }
          $newCommit = (git rev-parse origin/main).Trim(); $liveCommit = (git rev-parse HEAD).Trim()
          Write-Host "live=$liveCommit new=$newCommit"
          Write-Host "--- ISOLATED BUILD (web TETAP MELAYANI TRAFFIC) ---"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
          git clone --depth 1 --branch main $remoteUrl $buildDir
          if ($LASTEXITCODE -ne 0) { throw "git clone ke buildDir gagal" }
          Copy-Item "$liveDir\.env" "$buildDir\.env" -Force -ErrorAction SilentlyContinue
          Copy-Item "$liveDir\.env.local" "$buildDir\.env.local" -Force -ErrorAction SilentlyContinue
          Copy-Item "$liveDir\.env.production" "$buildDir\.env.production" -Force -ErrorAction SilentlyContinue
          Set-Location $buildDir
          Write-Host "npm ci di buildDir..."; npm.cmd ci --legacy-peer-deps; if ($LASTEXITCODE -ne 0) { throw "npm ci gagal" }
          Write-Host "next build di buildDir (live web masih ON)..."; npm.cmd run build; if ($LASTEXITCODE -ne 0) { throw "npm run build gagal" }
          if (!(Test-Path "$buildDir\.next\BUILD_ID")) { throw ".next/BUILD_ID tidak ditemukan" }
          Write-Host "Build sukses — siap swap."
          Write-Host "--- ATOMIC SWAP + RELOAD (downtime 1-2 detik) ---"
          Set-Location $liveDir
          try { & $pm2Cmd stop itsp-perusahaan 2>&1 | Out-String | Write-Host } catch {}; Start-Sleep -Seconds 2
          git reset --hard $newCommit; if ($LASTEXITCODE -ne 0) { throw "git reset gagal" }
          if (Test-Path ".next") { Remove-Item -Recurse -Force ".next" -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
          Copy-Item "$buildDir\.next" ".\.next" -Recurse -Force
          Copy-Item "$buildDir\package.json" ".\package.json" -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildDir\package-lock.json" ".\package-lock.json" -Force -ErrorAction SilentlyContinue
          $liveLock = Get-FileHash ".\package-lock.json" -Algorithm SHA256 -ErrorAction SilentlyContinue
          $buildLock = Get-FileHash "$buildDir\package-lock.json" -Algorithm SHA256 -ErrorAction SilentlyContinue
          if ($liveLock.Hash -ne $buildLock.Hash) {
            Write-Host "package-lock berbeda — sync node_modules..."
            if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
            Copy-Item "$buildDir\node_modules" ".\node_modules" -Recurse -Force
          } else { Write-Host "package-lock sama — skip copy node_modules." }
          & $pm2Cmd restart itsp-perusahaan; if ($LASTEXITCODE -ne 0) { & $pm2Cmd start npm --name "itsp-perusahaan" -- start }
          & $pm2Cmd save; & $pm2Cmd list
          try { Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue } catch {}
          Write-Host "=== ZERO-DOWNTIME DEPLOY SELESAI ==="
      - name: Health check :3008
        run: |
          $extraPaths = @(
            (Join-Path $env:APPDATA "npm"),
            "C:\Users\IT-PLASTECH\AppData\Roaming\npm",
            "C:\Users\Administrator\AppData\Roaming\npm",
            "C:\Program Files\nodejs"
          )
          foreach ($p in $extraPaths) { if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) { $env:Path = "$env:Path;$p" } }
          if (-not $env:PM2_HOME) { if (Test-Path "C:\Users\IT-PLASTECH\.pm2") { $env:PM2_HOME = "C:\Users\IT-PLASTECH\.pm2" } }
          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $pm2Cmd) { foreach ($p in $extraPaths) { $cand = Join-Path $p "pm2.cmd"; if (Test-Path $cand) { $pm2Cmd = $cand; break } } }
          Write-Host "Menunggu :3008 (polling 60s)..."; $maxAttempts=20; $attempt=0; $healthy=$false
          while ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 3; $attempt++; Write-Host "Percobaan $attempt/$maxAttempts..."; try { $res=Invoke-WebRequest -Uri "http://127.0.0.1:3008/" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop; if ($res.StatusCode -in @(200,307,308)) { Write-Host ">>> OK $($res.StatusCode)"; $healthy=$true; break } } catch { try { $res=Invoke-WebRequest -Uri "http://localhost:3008/" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop; if ($res.StatusCode -in @(200,307,308)) { Write-Host ">>> OK localhost $($res.StatusCode)"; $healthy=$true; break } } catch {}; Write-Host "warmup..." } }
          if (-not $healthy) { Write-Host "=== DIAG ==="; netstat -ano | findstr 3008; if ($pm2Cmd) { & $pm2Cmd logs itsp-perusahaan --lines 50 --nostream }; throw "Health check :3008 gagal setelah 60s" }
          Write-Host "Cek sitemap.xml..."; try { $sitemap=Invoke-WebRequest -Uri "http://127.0.0.1:3008/sitemap.xml" -UseBasicParsing -TimeoutSec 10; Write-Host "sitemap $($sitemap.StatusCode)" } catch { Write-Host "Warning sitemap belum siap tapi 200 OK" }
