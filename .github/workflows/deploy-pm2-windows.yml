name: Deploy web-perusahaan to D PM2

# FULL OTOMATIS: push ke main -> server D:\itsp-perusahaan langsung update (:3008).
# Syarat 1x di server (terakhir sentuh): runner jalan sebagai Administrator + pm2 global.
# Setelah itu: tidak perlu RDP lagi, cukup git push.
# .env.production di D:\itsp-perusahaan AMAN (di-ignore git, tidak tertimpa reset).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-itsp-perusahaan
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + build + pm2 restart :3008
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Update D:\itsp-perusahaan dari GitHub
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path D:\itsp-perusahaan\.git)) { throw "D:\itsp-perusahaan belum git clone web-perusahaan. Clone dulu di Server sebagai Administrator: git clone https://github.com/idthaisummitplastech/web-perusahaan.git D:\itsp-perusahaan" }
          Set-Location D:\itsp-perusahaan
          # Anti dubious-ownership (wajib bila runner ganti user)
          try { Remove-Item -Path "$env:USERPROFILE\.gitconfig.lock" -Force -ErrorAction SilentlyContinue } catch {}
          try { git config --global --add safe.directory '*' 2>$null } catch {}

          Write-Host "--- VERSIONS ---"
          node -v
          npm.cmd -v
          whoami
          Write-Host "USERPROFILE=$env:USERPROFILE APPDATA=$env:APPDATA"

          $extraPaths = @(
            (Join-Path $env:APPDATA "npm"),
            "C:\Users\IT-PLASTECH\AppData\Roaming\npm",
            "C:\Users\Administrator\AppData\Roaming\npm",
            "C:\Program Files\nodejs"
          )
          foreach ($p in $extraPaths) {
            if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) { $env:Path = "$env:Path;$p" }
          }
          if (-not $env:PM2_HOME) {
            if (Test-Path "C:\Users\IT-PLASTECH\.pm2") { $env:PM2_HOME = "C:\Users\IT-PLASTECH\.pm2" }
          }
          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $pm2Cmd) {
            foreach ($p in $extraPaths) {
              $cand = Join-Path $p "pm2.cmd"
              if (Test-Path $cand) { $pm2Cmd = $cand; break }
            }
          }
          if (-not $pm2Cmd) {
            Write-Host "pm2.cmd tidak ditemukan, install global..."
            npm.cmd i -g pm2
            $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
            if (-not $pm2Cmd) {
              $maybe = Join-Path (Join-Path $env:APPDATA "npm") "pm2.cmd"
              if (Test-Path $maybe) { $pm2Cmd = $maybe }
            }
          }
          if (-not $pm2Cmd) { throw "pm2.cmd tetap tidak ditemukan setelah npm i -g pm2. Fix 1x di server sebagai Administrator: npm i -g pm2" }
          Write-Host "pm2 at: $pm2Cmd"
          & $pm2Cmd -v

          Write-Host "--- STOP app dulu agar lepas lock node_modules/.next (wajib untuk full-otomatis) ---"
          try { & $pm2Cmd stop itsp-perusahaan 2>&1 | Out-String | Write-Host } catch {}
          Start-Sleep -Seconds 3

          Write-Host "--- GIT FETCH + RESET (best-effort self-heal, tanpa butuh RDP) ---"
          # Hapus FETCH_HEAD korup bila ada (jangan throw bila permission kurang, lanjut ke pesan jelas)
          try { Remove-Item -Path .git\FETCH_HEAD -Force -ErrorAction SilentlyContinue } catch {}
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WARNING fetch gagal, coba hapus FETCH_HEAD sekali lagi..."
            try { Remove-Item -Path .git\FETCH_HEAD -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 2
            git fetch origin main
          }
          if ($LASTEXITCODE -ne 0) {
            throw "git fetch gagal terus: 'cannot open .git/FETCH_HEAD: Permission denied'. Artinya folder D:\itsp-perusahaan\.git milik Administrator tapi runner jalan sebagai NETWORK SERVICE. Fix 1x TERAKHIR di server (Administrator CMD): takeown /F D:\itsp-perusahaan /R /D Y + icacls D:\itsp-perusahaan /grant 'NETWORK SERVICE:(OI)(CI)F' /T ATAU (disarankan untuk full-otomatis) ganti service runner jadi Administrator. Lihat PANDUAN_DEPLOY_D_PM2.md S8b."
          }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset gagal (unable to unlink package-lock.json). File dikunci / permission. Pastikan pm2 stop sukses + runner sudah Administrator. Coba Re-run jobs sekali lagi." }

          Write-Host "--- BUILD (hapus .next dulu, tanpa sentuh server) ---"
          if (Test-Path .next) { Remove-Item -Recurse -Force .next -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; if (Test-Path .next) { Remove-Item -Recurse -Force .next } }
          npm.cmd ci --legacy-peer-deps
          npm.cmd run build
          & $pm2Cmd restart itsp-perusahaan
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pm2 restart gagal, coba pm2 start pertama kali..."
            & $pm2Cmd start npm --name "itsp-perusahaan" -- start
          }
          & $pm2Cmd save
          & $pm2Cmd list

      - name: Health check :3008
        run: |
          $extraPaths = @(
            (Join-Path $env:APPDATA "npm"),
            "C:\Users\IT-PLASTECH\AppData\Roaming\npm",
            "C:\Users\Administrator\AppData\Roaming\npm",
            "C:\Program Files\nodejs"
          )
          foreach ($p in $extraPaths) {
            if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) { $env:Path = "$env:Path;$p" }
          }
          if (-not $env:PM2_HOME) {
            if (Test-Path "C:\Users\IT-PLASTECH\.pm2") { $env:PM2_HOME = "C:\Users\IT-PLASTECH\.pm2" }
          }
          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $pm2Cmd) {
            foreach ($p in $extraPaths) {
              $cand = Join-Path $p "pm2.cmd"
              if (Test-Path $cand) { $pm2Cmd = $cand; break }
            }
          }

          Write-Host "Menunggu aplikasi Next.js boot di port 3008 (polling retry hingga 60 detik)..."
          $maxAttempts = 20
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 3
            $attempt++
            Write-Host "Pengecekan port 3008 (Percobaan $attempt/$maxAttempts)..."
            try {
              $res = Invoke-WebRequest -Uri "http://127.0.0.1:3008/" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($res.StatusCode -eq 200 -or $res.StatusCode -eq 308 -or $res.StatusCode -eq 307) {
                Write-Host ">>> Berhasil terhubung ke port 3008! HTTP Status: $($res.StatusCode)"
                $healthy = $true
                break
              }
            } catch {
              try {
                $res = Invoke-WebRequest -Uri "http://localhost:3008/" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                if ($res.StatusCode -eq 200 -or $res.StatusCode -eq 308 -or $res.StatusCode -eq 307) {
                  Write-Host ">>> Berhasil terhubung ke port 3008 (localhost)! HTTP Status: $($res.StatusCode)"
                  $healthy = $true
                  break
                }
              } catch {}
              Write-Host "Aplikasi masih proses warmup / booting, menunggu 3 detik lagi..."
            }
          }

          if (-not $healthy) {
            Write-Host "=== DIAGNOSA KEGAGALAN HEALTH CHECK ==="
            Write-Host "Cek status port 3008 di sistem:"
            netstat -ano | findstr 3008
            Write-Host "Log 50 baris terakhir PM2 itsp-perusahaan:"
            if ($pm2Cmd) {
              & $pm2Cmd logs itsp-perusahaan --lines 50 --nostream
            }
            throw "Health check gagal: Aplikasi Next.js pada port 3008 belum merespon setelah 60 detik."
          }

          Write-Host "Pengecekan sitemap.xml..."
          try {
            $sitemap = Invoke-WebRequest -Uri "http://127.0.0.1:3008/sitemap.xml" -UseBasicParsing -TimeoutSec 10
            Write-Host "sitemap.xml status: $($sitemap.StatusCode)"
          } catch {
            Write-Host "Warning: sitemap.xml belum siap ($($_.Exception.Message)) tapi halaman utama sudah 200 OK."
          }

